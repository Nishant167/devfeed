[project]
name = "devfeed-stage0"
version = "0.1.0"
description = "Stage 0 scroll-test: a throwaway script to validate GitHub repo ranking before building real infrastructure."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["stage0/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stage0"]
